name: Deploy to stage server
on:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x.x
          cache: npm
      - run: cd client && npm ci --force
      - run: cd client && npm run lint
      - run: cd client && npm run lint:types
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x.x
          cache: npm
      - run: cd client && npm ci --force
      - run: cd client && npm run format:fix
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x.x
          cache: npm
      - run: cd client && npm ci --force
      - run: cd client && npm run test
  prod:
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    steps:
      - name: ssh command
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            rm -rf dvholidays
            git clone git@github.com:Vostafi69/dvholidays.git
            cd ./dvholidays
            git checkout main
            docker compose -f docker-compose-stage.yml down
            docker image rm dvholidays-client:latest
            docker compose -f docker-compose-stage.yml up -d --build
  e2e:
    needs: prod
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x.x
      - name: Install dependencies
        run: npm ci --force
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps --force
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
